networks:
  fintech-net:
    driver: bridge

volumes:
  postgres_user_data:
  postgres_account_data:
  postgres_transaction_data:
  minio_data:
  kafka_data:

services:

  # ─── Infrastructure ────────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    networks: [fintech-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    networks: [fintech-net]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    networks: [fintech-net]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092

  postgres-user:
    image: postgres:16-alpine
    container_name: postgres-user
    networks: [fintech-net]
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-account:
    image: postgres:16-alpine
    container_name: postgres-account
    networks: [fintech-net]
    volumes:
      - postgres_account_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: accountdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-transaction:
    image: postgres:16-alpine
    container_name: postgres-transaction
    networks: [fintech-net]
    volumes:
      - postgres_transaction_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: transactiondb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    networks: [fintech-net]
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    networks: [fintech-net]
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks: [fintech-net]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks: [fintech-net]
    depends_on: [prometheus]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    networks: [fintech-net]
    ports:
      - "16686:16686"  # UI
      - "4318:4318"    # OTLP HTTP

  # ─── API Gateway ───────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: api-gateway
    networks: [fintech-net]
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - account-service
      - transaction-service

  # ─── Services ──────────────────────────────────────────────────────

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    networks: [fintech-net]
    depends_on:
      postgres-user:
        condition: service_healthy
    environment:
      DB_HOST: postgres-user
      DB_PORT: "5432"
      DB_NAME: userdb
      DB_USER: postgres
      DB_PASSWORD: secret
      JWT_SECRET: ${JWT_SECRET:-fintech-jwt-secret}
    ports:
      - "3001:3001"

  account-service:
    build:
      context: ./services/account-service
      dockerfile: Dockerfile
    container_name: account-service
    networks: [fintech-net]
    depends_on:
      postgres-account:
        condition: service_healthy
    environment:
      DB_HOST: postgres-account
      DB_PORT: "5432"
      DB_NAME: accountdb
      DB_USER: postgres
      DB_PASSWORD: secret
      JWT_SECRET: ${JWT_SECRET:-fintech-jwt-secret}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-fintech-internal-secret}
    ports:
      - "3002:3002"

  transaction-service:
    build:
      context: ./services/transaction-service
      dockerfile: Dockerfile
    container_name: transaction-service
    networks: [fintech-net]
    depends_on:
      postgres-transaction:
        condition: service_healthy
      kafka:
        condition: service_healthy
      account-service:
        condition: service_started
    environment:
      DB_HOST: postgres-transaction
      DB_PORT: "5432"
      DB_NAME: transactiondb
      DB_USER: postgres
      DB_PASSWORD: secret
      JWT_SECRET: ${JWT_SECRET:-fintech-jwt-secret}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-fintech-internal-secret}
    ports:
      - "3003:3003"
