events {
  worker_connections 1024;
}

http {
  # ── Logging ────────────────────────────────────────────────────────
  log_format main '$remote_addr - $request_time s '
                  '"$request" $status $body_bytes_sent';
  access_log /var/log/nginx/access.log main;

  # ── Rate limiting — auth endpoints only ───────────────────────────
  # 10 requests/second per IP, burst of 20 before returning 429
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

  # ── Upstreams (one per microservice) ───────────────────────────────
  upstream user_service {
    server user-service:3001;
  }

  upstream account_service {
    server account-service:3002;
  }

  upstream transaction_service {
    server transaction-service:3003;
  }

  server {
    listen 80;

    # ── Health check for the gateway itself ──────────────────────────
    location /health {
      return 200 '{"status":"ok","service":"api-gateway"}';
      add_header Content-Type application/json;
    }

    # ── Auth routes (rate-limited) ───────────────────────────────────
    location /api/v1/auth/ {
      limit_req zone=auth_limit burst=20 nodelay;
      limit_req_status 429;

      proxy_pass         http://user_service;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Request-ID      $request_id;
      proxy_read_timeout 30s;
    }

    # ── User Service routes ──────────────────────────────────────────
    location /api/v1/users/ {
      proxy_pass         http://user_service;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Request-ID      $request_id;
      proxy_read_timeout 30s;
    }

    # ── Account Service routes ───────────────────────────────────────
    # Matches both /api/v1/accounts and /api/v1/accounts/{id}
    location ~ ^/api/v1/accounts(/|$) {
      proxy_pass         http://account_service;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Request-ID      $request_id;
      proxy_read_timeout 30s;
    }

    # ── Transaction Service routes ───────────────────────────────────
    # Matches both /api/v1/transactions and /api/v1/transactions/{id}
    location ~ ^/api/v1/transactions(/|$) {
      proxy_pass         http://transaction_service;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Request-ID      $request_id;
      proxy_read_timeout 30s;
    }

    # ── Catch-all 404 ────────────────────────────────────────────────
    location / {
      return 404 '{"error":"route not found"}';
      add_header Content-Type application/json;
    }
  }
}
