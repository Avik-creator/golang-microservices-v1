events {
  worker_connections 1024;
}

http {
  # ── Logging ────────────────────────────────────────────────────────
  log_format main '$remote_addr - $request_time s '
                  '"$request" $status $body_bytes_sent';
  access_log /var/log/nginx/access.log main;

  # ── Upstreams (one per microservice) ───────────────────────────────
  upstream user_service {
    server user-service:3001;
  }

  upstream account_service {
    server account-service:3002;
  }

  upstream transaction_service {
    server transaction-service:3003;
  }

  server {
    listen 80;

    # ── Health check for the gateway itself ──────────────────────────
    location /health {
      return 200 '{"status":"ok","service":"api-gateway"}';
      add_header Content-Type application/json;
    }

    # ── User Service routes ──────────────────────────────────────────
    location /api/v1/users/ {
      proxy_pass         http://user_service;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Request-ID      $request_id;
      proxy_read_timeout 30s;
    }

    location /api/v1/auth/ {
      proxy_pass         http://user_service;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Request-ID      $request_id;
      proxy_read_timeout 30s;
    }

    # ── Account Service routes ───────────────────────────────────────
    location /api/v1/accounts {
      proxy_pass         http://account_service;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Request-ID      $request_id;
      proxy_read_timeout 30s;
    }

    # ── Transaction Service routes ───────────────────────────────────
    location /api/v1/transactions {
      proxy_pass         http://transaction_service;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Request-ID      $request_id;
      proxy_read_timeout 30s;
    }

    # ── Catch-all 404 ────────────────────────────────────────────────
    location / {
      return 404 '{"error":"route not found"}';
      add_header Content-Type application/json;
    }
  }
}
